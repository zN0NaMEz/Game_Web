<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Pose Runner Game - Teachable Machine</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #e8f0ff;
      transition: 0.3s;
    }

    h2, h3 {
      margin: 8px;
    }

    button {
      font-size: 18px;
      padding: 10px 20px;
      cursor: pointer;
      margin: 8px;
      border-radius: 8px;
      border: 1px solid #999;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 25px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    canvas {
      border: 2px solid #333;
      border-radius: 10px;
      background: white;
    }

    .box {
      max-width: 460px;
      margin: 15px auto;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.65);
    }

    .score {
      font-size: 18px;
      margin: 8px 0;
    }

    #result {
      font-size: 26px;
      font-weight: bold;
    }

    #confidence {
      font-size: 20px;
    }

    #action {
      font-size: 22px;
      font-weight: bold;
      margin-top: 10px;
    }

    #gameStatus {
      font-size: 26px;
      font-weight: bold;
      color: #222;
    }

    #gameScore {
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h2>Pose Runner Game</h2>
  <h3>stand = หยุด | walk = เดิน | jump = กระโดด</h3>

  <button id="startBtn" type="button" onclick="init()">เริ่มเกม</button>
  <button type="button" onclick="restartGame()">เริ่มใหม่</button>

  <div class="box">
    <div id="gameStatus">สถานะเกม: ยังไม่เริ่ม</div>
    <div id="gameScore">คะแนน: 0</div>
  </div>

  <div class="container">
    <div>
      <h3>กล้องตรวจจับท่าทาง</h3>
      <canvas id="cameraCanvas" width="400" height="400"></canvas>
    </div>

    <div>
      <h3>เกม</h3>
      <canvas id="gameCanvas" width="600" height="300"></canvas>
    </div>
  </div>

  <div class="box">
    <div id="result">ผลลัพธ์: -</div>
    <div id="confidence">ความมั่นใจ: -</div>
    <div id="action">สถานะ: ยังไม่เริ่ม</div>
  </div>

  <div class="box">
    <h3>คะแนนแต่ละ Class</h3>
    <div id="class1" class="score">Class 1: -</div>
    <div id="class2" class="score">Class 2: -</div>
    <div id="class3" class="score">Class 3: -</div>
  </div>

  <!-- TensorFlow.js -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>

  <!-- Teachable Machine Pose Library -->
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8.3/dist/teachablemachine-pose.min.js"></script>

  <script>
    // ===============================
    // Teachable Machine Model
    // ===============================
    const MODEL_URL = "https://teachablemachine.withgoogle.com/models/Your model/";
    const CONFIDENCE_LIMIT = 0.80;

    let model;
    let webcam;
    let cameraCtx;
    let maxPredictions;
    let isRunning = false;

    let currentPose = "stand";
    let currentConfidence = 0;

    // ===============================
    // Game Variables
    // ===============================
    const gameCanvas = document.getElementById("gameCanvas");
    const gameCtx = gameCanvas.getContext("2d");

    let gameRunning = false;
    let gameOver = false;
    let score = 0;
    let frame = 0;

    const player = {
      x: 80,
      y: 220,
      width: 45,
      height: 60,
      velocityY: 0,
      gravity: 0.9,
      jumpPower: -16,
      isJumping: false
    };

    const groundY = 280;

    let obstacles = [];
    let obstacleSpeed = 0;

    // ใช้กันกระโดดซ้ำรัว ๆ
    let lastPoseForJump = "stand";

    async function init() {
      const startBtn = document.getElementById("startBtn");
      const actionText = document.getElementById("action");

      try {
        startBtn.disabled = true;
        startBtn.innerHTML = "กำลังโหลด...";
        actionText.innerHTML = "สถานะ: กำลังโหลดโมเดล";

        const modelURL = MODEL_URL + "model.json";
        const metadataURL = MODEL_URL + "metadata.json";

        model = await tmPose.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        if (maxPredictions !== 3) {
          actionText.innerHTML = "คำเตือน: โมเดลนี้ไม่ได้มี 3 Class";
        }

        const size = 400;
        const flip = true;

        webcam = new tmPose.Webcam(size, size, flip);

        await webcam.setup();
        await webcam.play();

        const cameraCanvas = document.getElementById("cameraCanvas");
        cameraCanvas.width = size;
        cameraCanvas.height = size;
        cameraCtx = cameraCanvas.getContext("2d");

        isRunning = true;
        startBtn.innerHTML = "กำลังใช้งาน";
        actionText.innerHTML = "สถานะ: เริ่มตรวจจับท่าทางแล้ว";

        startGame();

        window.requestAnimationFrame(loop);
      } catch (error) {
        console.error(error);
        startBtn.disabled = false;
        startBtn.innerHTML = "เริ่มเกม";
        actionText.innerHTML = "เกิดข้อผิดพลาด: เปิดกล้องหรือโหลดโมเดลไม่ได้";
      }
    }

    async function loop() {
      if (!isRunning) return;

      webcam.update();
      await predict();

      updateGame();
      drawGame();

      window.requestAnimationFrame(loop);
    }

    async function predict() {
      const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
      const prediction = await model.predict(posenetOutput);

      const class1Name = prediction[0].className;
      const class1Score = prediction[0].probability;

      const class2Name = prediction[1].className;
      const class2Score = prediction[1].probability;

      const class3Name = prediction[2].className;
      const class3Score = prediction[2].probability;

      document.getElementById("class1").innerHTML =
        class1Name + ": " + (class1Score * 100).toFixed(2) + "%";

      document.getElementById("class2").innerHTML =
        class2Name + ": " + (class2Score * 100).toFixed(2) + "%";

      document.getElementById("class3").innerHTML =
        class3Name + ": " + (class3Score * 100).toFixed(2) + "%";

      let bestPrediction = prediction[0];

      for (let i = 1; i < prediction.length; i++) {
        if (prediction[i].probability > bestPrediction.probability) {
          bestPrediction = prediction[i];
        }
      }

      const resultName = bestPrediction.className;
      const resultScore = bestPrediction.probability;

      document.getElementById("result").innerHTML =
        "ผลลัพธ์: " + resultName;

      document.getElementById("confidence").innerHTML =
        "ความมั่นใจ: " + (resultScore * 100).toFixed(2) + "%";

      if (resultScore < CONFIDENCE_LIMIT) {
        currentPose = "unknown";
        currentConfidence = resultScore;

        document.getElementById("action").innerHTML =
          "สถานะ: ยังไม่มั่นใจพอ";

        document.body.style.backgroundColor = "#f5f5f5";
      } else {
        currentPose = resultName.toLowerCase();
        currentConfidence = resultScore;

        document.getElementById("action").innerHTML =
          "สถานะ: ตรวจพบ " + resultName;

        if (currentPose === "stand") {
          document.body.style.backgroundColor = "#e8f0ff";
        } else if (currentPose === "walk") {
          document.body.style.backgroundColor = "#e8ffe8";
        } else if (currentPose === "jump") {
          document.body.style.backgroundColor = "#fff3e8";
        }
      }

      drawPose(pose);
    }

    function drawPose(pose) {
      cameraCtx.drawImage(webcam.canvas, 0, 0);

      if (pose) {
        const minPartConfidence = 0.5;
        tmPose.drawKeypoints(pose.keypoints, minPartConfidence, cameraCtx);
        tmPose.drawSkeleton(pose.keypoints, minPartConfidence, cameraCtx);
      }
    }

    // ===============================
    // Game Logic
    // ===============================
    function startGame() {
      gameRunning = true;
      gameOver = false;
      score = 0;
      frame = 0;
      obstacleSpeed = 0;
      obstacles = [];

      currentPose = "stand";
      lastPoseForJump = "stand";

      player.y = 220;
      player.velocityY = 0;
      player.isJumping = false;

      document.getElementById("gameStatus").innerHTML =
        "สถานะเกม: รอเดิน";
      document.getElementById("gameScore").innerHTML =
        "คะแนน: 0";
    }

    function restartGame() {
      startGame();
    }

    function updateGame() {
      if (!gameRunning || gameOver) return;

      // ===============================
      // stand = หยุดนิ่งจริง ๆ
      // ไม่เพิ่มคะแนน
      // ไม่ขยับสิ่งกีดขวาง
      // ไม่สร้างสิ่งกีดขวาง
      // ===============================
      if (currentPose === "stand") {
        obstacleSpeed = 0;
        lastPoseForJump = currentPose;

        document.getElementById("gameStatus").innerHTML =
          "สถานะเกม: ยืนอยู่ / หยุดนิ่ง";

        document.getElementById("gameScore").innerHTML =
          "คะแนน: " + score;

        return;
      }

      // ถ้าโมเดลยังไม่มั่นใจ ก็หยุดเกมไว้ก่อนเหมือน stand
      if (currentPose === "unknown") {
        obstacleSpeed = 0;
        lastPoseForJump = currentPose;

        document.getElementById("gameStatus").innerHTML =
          "สถานะเกม: รอให้โมเดลมั่นใจก่อน";

        return;
      }

      frame++;

      // ===============================
      // jump = กระโดด
      // ให้ฉากเลื่อนต่อเล็กน้อย เพื่อให้หลบสิ่งกีดขวางได้
      // ===============================
      if (currentPose === "jump" && lastPoseForJump !== "jump") {
        jumpPlayer();
      }

      // ===============================
      // walk = เกมเดิน
      // ===============================
      if (currentPose === "walk") {
        obstacleSpeed = 5;
        score += 1;

        document.getElementById("gameStatus").innerHTML =
          "สถานะเกม: กำลังเดิน";
      }

      // ===============================
      // jump = กระโดดและเกมยังเลื่อนต่อ
      // ถ้าอยากให้ jump หยุดฉากด้วย ให้เปลี่ยน obstacleSpeed เป็น 0
      // ===============================
      else if (currentPose === "jump") {
        obstacleSpeed = 5;

        document.getElementById("gameStatus").innerHTML =
          "สถานะเกม: กระโดด";
      }

      lastPoseForJump = currentPose;

      // อัปเดตผู้เล่น
      player.y += player.velocityY;
      player.velocityY += player.gravity;

      if (player.y >= 220) {
        player.y = 220;
        player.velocityY = 0;
        player.isJumping = false;
      }

      // สร้างสิ่งกีดขวางเฉพาะตอน walk หรือ jump
      if (frame % 90 === 0) {
        createObstacle();
      }

      // ขยับสิ่งกีดขวาง เฉพาะตอนที่ไม่ใช่ stand
      for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= obstacleSpeed;

        if (checkCollision(player, obstacles[i])) {
          endGame();
        }

        if (obstacles[i].x + obstacles[i].width < 0) {
          obstacles.splice(i, 1);
        }
      }

      document.getElementById("gameScore").innerHTML =
        "คะแนน: " + score;
    }

    function jumpPlayer() {
      if (!player.isJumping) {
        player.velocityY = player.jumpPower;
        player.isJumping = true;
      }
    }

    function createObstacle() {
      obstacles.push({
        x: gameCanvas.width,
        y: 235,
        width: 35,
        height: 45
      });
    }

    function checkCollision(a, b) {
      return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }

    function endGame() {
      gameOver = true;
      gameRunning = false;

      document.getElementById("gameStatus").innerHTML =
        "สถานะเกม: Game Over";
    }

    function drawGame() {
      gameCtx.clearRect(0, 0, gameCanvas.width, gameCanvas.height);

      // พื้นหลัง
      gameCtx.fillStyle = "#dff3ff";
      gameCtx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

      // ดวงอาทิตย์
      gameCtx.beginPath();
      gameCtx.arc(520, 55, 30, 0, Math.PI * 2);
      gameCtx.fillStyle = "#ffd966";
      gameCtx.fill();

      // พื้น
      gameCtx.fillStyle = "#78c26d";
      gameCtx.fillRect(0, groundY, gameCanvas.width, 20);

      // เส้นพื้น
      gameCtx.fillStyle = "#4b8b3b";
      gameCtx.fillRect(0, groundY, gameCanvas.width, 5);

      // ผู้เล่น
      gameCtx.fillStyle = "#4a7cff";
      gameCtx.fillRect(player.x, player.y, player.width, player.height);

      // หัวผู้เล่น
      gameCtx.beginPath();
      gameCtx.arc(player.x + 22, player.y - 15, 18, 0, Math.PI * 2);
      gameCtx.fillStyle = "#ffcc99";
      gameCtx.fill();

      // สิ่งกีดขวาง
      for (let obs of obstacles) {
        gameCtx.fillStyle = "#ff5c5c";
        gameCtx.fillRect(obs.x, obs.y, obs.width, obs.height);
      }

      // แสดงข้อมูลบนจอเกม
      gameCtx.fillStyle = "#222";
      gameCtx.font = "20px Arial";
      gameCtx.fillText("Pose: " + currentPose, 20, 30);
      gameCtx.fillText("Score: " + score, 20, 60);

      if (currentPose === "stand" && gameRunning && !gameOver) {
        gameCtx.fillStyle = "rgba(255, 255, 255, 0.75)";
        gameCtx.fillRect(190, 105, 230, 75);

        gameCtx.fillStyle = "#222";
        gameCtx.font = "28px Arial";
        gameCtx.fillText("หยุดนิ่ง", 255, 140);

        gameCtx.font = "18px Arial";
        gameCtx.fillText("ทำท่า walk เพื่อเดินต่อ", 215, 165);
      }

      if (!gameRunning && !gameOver) {
        gameCtx.fillStyle = "#222";
        gameCtx.font = "28px Arial";
        gameCtx.fillText("กดเริ่มเกม", 230, 145);
      }

      if (gameOver) {
        gameCtx.fillStyle = "rgba(0, 0, 0, 0.55)";
        gameCtx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

        gameCtx.fillStyle = "white";
        gameCtx.font = "42px Arial";
        gameCtx.fillText("GAME OVER", 170, 135);

        gameCtx.font = "24px Arial";
        gameCtx.fillText("คะแนน: " + score, 245, 175);
        gameCtx.fillText("กดปุ่ม เริ่มใหม่ เพื่อเล่นอีกครั้ง", 145, 215);
      }
    }

    drawGame();
  </script>
</body>
</html>
